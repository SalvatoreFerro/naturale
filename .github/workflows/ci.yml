name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch official ExifTool source on Linux
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exiftool/exiftool
          ref: "1da714924f67763b6a8a7013dd2aa1983a16f87b" # ExifTool 13.63
          path: .tools/exiftool
          persist-credentials: false
      - name: Enable ExifTool on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x .tools/exiftool/exiftool
          echo "$GITHUB_WORKSPACE/.tools/exiftool" >> "$GITHUB_PATH"
      - name: Install ExifTool on macOS
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install exiftool -y --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install optional C2PA integration
        if: runner.os == 'Linux' && (matrix.python == '3.12' || matrix.python == '3.13')
        run: python -m pip install -e '.[c2pa]'
      - name: Verify required tools
        run: |
          python --version
          exiftool -ver
          python skills/naturale/scripts/images.py --help
          python skills/naturale/scripts/text.py --help
          python scripts/doctor.py --help
      - name: Run tests
        run: python -m pytest
      - name: Validate editorial dataset
        run: |
          python scripts/evaluate.py --validate-cases evals/cases.jsonl --pilot
          python scripts/evaluate.py --validate-cases evals/real-world-template.jsonl
          python scripts/evaluate.py --validate-cases evals/editorial-structure.jsonl
          python scripts/evaluate.py --validate-cases evals/italian-language.jsonl
          python scripts/evaluate.py --validate-cases evals/fluency-fidelity.jsonl
