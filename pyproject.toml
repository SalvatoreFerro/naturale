[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "naturale-skill"
version = "0.2.0"
description = "Skill italiana per editing e gestione locale della provenienza delle immagini"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
c2pa = ["c2pa-python>=0.38.1,<0.39"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
